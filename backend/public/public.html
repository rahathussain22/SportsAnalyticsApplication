<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Football Match Updates</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #0066cc;
    }

    .match-card {
      max-width: 600px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }

    .match-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .teams {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 10px;
    }

    .team {
      text-align: center;
    }

    .score {
      font-size: 32px;
      font-weight: bold;
      color: #222;
    }

    .events {
      margin-top: 10px;
      background-color: #f9fafb;
      border-radius: 8px;
      padding: 10px;
    }

    .event-item {
      padding: 5px 0;
      border-bottom: 1px solid #ddd;
    }

    .event-item:last-child {
      border-bottom: none;
    }

    .live {
      color: red;
      font-weight: bold;
    }

    .completed {
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>⚽ Live Football Match</h1>
  <div id="match-container" class="match-card">
    <p>Waiting for live updates...</p>
  </div>

  <script>
    // Connect to backend server
    const socket = io("http://localhost:9000", {
      transports: ["websocket"],
    });

    const matchContainer = document.getElementById("match-container");

    socket.on("connect", () => {
      console.log("Connected to server:", socket.id);
    });

    // Listen for match updates
    socket.on("matchUpdated", (data) => {
      console.log("Received match update:", data);
      const match = data.matchData; // match object from your backend response

      matchContainer.innerHTML = `
        <div class="match-info">
          <h2>Match #${match.matchNumber}</h2>
          <span class="${match.status === "live" ? "live" : "completed"}">
            ${match.status.toUpperCase()}
          </span>
        </div>
        <div class="teams">
          <div class="team">
            <p><strong>Home</strong></p>
            <p class="score">${match.score[0]?.score ?? 0}</p>
          </div>
          <div class="team">
            <p><strong>Away</strong></p>
            <p class="score">${match.score[1]?.score ?? 0}</p>
          </div>
        </div>
        <p><strong>Minute:</strong> ${match.currentMinute}'</p>
        <p><strong>Venue:</strong> ${match.venue}</p>
        <p><strong>Date:</strong> ${new Date(match.date).toLocaleString()}</p>

        <div class="events">
          <h3>Match Events:</h3>
          ${
            match.events.length
              ? match.events
                  .map(
                    (event, i) =>
                      `<div class="event-item">⚽ ${event.type} at ${event.minute}'</div>`
                  )
                  .join("")
              : "<p>No events yet</p>"
          }
        </div>
      `;
    });
  </script>
</body>
</html>
